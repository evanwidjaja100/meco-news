name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit-${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test without public network
        run: python -B -m unittest discover -s tests -v
      - name: Validate configuration
        run: python -B -m meco_news --config-show --json

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.14"
          cache: pip
      - name: Install locked development tools
        run: python -m pip install -r requirements-dev.lock
      - name: Ruff
        run: python -m ruff check meco_news tests
      - name: Type check
        run: python -m mypy meco_news
      - name: Build-context sentinel
        run: python scripts/verify-build-context.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.14"
      - name: Build wheel and source distribution
        run: python -m pip install build==1.2.2.post1 setuptools==75.8.0 wheel==0.45.1 && python -m build --no-isolation
      - name: Installed wheel smoke test
        run: |
          python -m venv /tmp/meco-wheel-venv
          /tmp/meco-wheel-venv/bin/python -m pip install --no-index dist/*.whl
          /tmp/meco-wheel-venv/bin/meco-news --config-show --json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compose syntax
        run: docker compose config --no-interpolate --quiet
      - name: Build image
        run: docker build --build-arg PYTHON_IMAGE=docker.io/library/python:3.14-slim-bookworm -t meco-news:ci .
