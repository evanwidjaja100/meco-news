name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit-${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test without public network
        run: python -B -m unittest discover -s tests -v
      - name: Validate configuration
        run: python -B -m meco_news --config-show --json

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.14"
          cache: pip
      - name: Install locked development tools
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Ruff
        run: python -m ruff check meco_news tests scripts
      - name: Type check
        run: python -m mypy meco_news
      - name: Build-context sentinel
        run: python scripts/verify-build-context.py --require-docker

  coverage:
    name: coverage-and-critical-branches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.14"
      - name: Install locked development tools
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Test and publish coverage artifacts
        run: |
          python -m coverage erase
          python -m coverage run --branch --source=meco_news -m pytest --junitxml=pytest-junit.xml
          python -m coverage json -o coverage.json
          python scripts/coverage_gate.py --coverage-json coverage.json --critical-branches scripts/critical-branches.json
          python -m coverage xml -o coverage.xml
        env:
          COVERAGE_FILE: .coverage
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.14"
      - name: Install locked build and test tools
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Prepare isolated sdist build wheelhouse
        run: python -m pip download --only-binary=:all: --require-hashes --dest build-tools -r requirements-build.lock
      - name: Installed wheel smoke test outside checkout
        run: python scripts/package-smoke.py "$(find dist -name '*.whl' -print -quit)" --config config/watchlist.json
      - name: Installed sdist smoke test outside checkout
        run: python scripts/package-smoke.py "$(find dist -name '*.tar.gz' -print -quit)" --config config/watchlist.json --build-tools build-tools

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compose syntax
        run: docker compose config --no-interpolate --quiet
      - name: Build image from immutable base
        run: docker build --build-arg PYTHON_IMAGE=docker.io/library/python:3.14-slim-bookworm@sha256:9ab8d9c8514b44f90cf0029dd42fdd7e9e211e639c8b995304cc04568dee900f -t meco-news:ci .
